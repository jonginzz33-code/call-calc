name: Diag launch
on:
  push:
    branches: [ diag-launch ]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests "com.jongin.callcalc.LaunchTest" || true
      - run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -o 'testcase name="[^"]*"' $f; done
          python3 - <<'PY'
          import glob,re,html
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              t=open(f).read()
              for name,body in re.findall(r'<testcase name="([^"]*)".*?>(.*?)</testcase>',t,re.S):
                  m=re.search(r'<failure[^>]*>(.*?)</failure>',body,re.S)
                  print("TEST",name,"FAIL" if m else "OK")
                  if m:
                      lines=html.unescape(m.group(1)).split('\n')
                      keep=[l for l in lines if 'jongin' in l or not l.strip().startswith('at ')]
                      print('\n'.join(keep[:40]))
          PY
