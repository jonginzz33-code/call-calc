name: Diag launch
on:
  push:
    branches: [ diag-launch ]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests "com.jongin.callcalc.LaunchTest" || true
      - run: python3 -c "import glob,re;[print(re.sub(r'&#10;|&quot;','\n',m)[:6000]) for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml') for m in re.findall(r'<failure[^>]*>(.*?)</failure>',open(f).read(),re.S)]"
